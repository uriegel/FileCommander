<!DOCTYPE html>
<html>
<head>
    <title>Virtual Table</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="blue">
    <div class="tableContainer">
        <virtual-table id="virtual-table"></virtual-table>
    </div>

    <template id="item">
        <tr>
            <td style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
                <span>
                    <img id="img" class="icon" style="width: 16px; height: 16px; vertical-align: bottom; text-overflow: ellipsis; overflow: hidden;" />
                </span>
                <span id="text"></span>
            </td>
            <td id="item2" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap;"></td>
            <td id="item3" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap;"></td>
        </tr>
    </template>

    <script type="module" src="index.js"></script>
</body>
</html>
